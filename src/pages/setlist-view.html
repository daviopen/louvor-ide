<!DOCTYPE html>
<html lang="pt-BR" class="auth-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090b0c">
  <title>Setlist — Cifra e letra | IDE Music</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="../config/firebase-config.js"></script>
  <script src="../js/modules/auth-service.js?v=20260825-email"></script>
  <script src="../js/modules/app-shell.js?v=20260825-sidebar" defer></script>
  <script src="../js/modules/chord-transposer.js"></script>
  <script src="../js/modules/setlist-performance-view.js?v=20260826-single-song" defer></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/music-ide-theme.css">
  <link rel="stylesheet" href="../css/setlist-performance-view.css">
</head>
<body>
  <main class="performance-page" aria-labelledby="setlist-title">
    <header class="performance-header">
      <div>
        <p id="performance-eyebrow" class="performance-eyebrow">SETLIST · CIFRA E LETRA</p>
        <h1 id="setlist-title">Carregando setlist…</h1>
        <p id="setlist-meta" class="performance-meta">Preparando repertório</p>
      </div>
      <div class="performance-header-actions" aria-label="Ações do setlist">
        <a id="performance-back-link" class="performance-button performance-button--secondary" href="setlists.html?view=upcoming">
          <i class="fas fa-arrow-left" aria-hidden="true"></i><span id="performance-back-label">Setlists</span>
        </a>
        <button id="stage-mode-button" class="performance-button performance-button--primary" type="button" aria-pressed="false">
          <i class="fas fa-expand" aria-hidden="true"></i><span>Modo palco</span>
        </button>
      </div>
    </header>

    <section id="loading" class="performance-state" role="status" aria-live="polite">
      <i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i>
      <span>Carregando músicas, cifras e letras…</span>
    </section>

    <section id="error" class="performance-state performance-state--error" role="alert" hidden></section>

    <section id="viewer" class="performance-viewer" hidden>
      <nav id="song-strip" class="song-strip" aria-label="Músicas do setlist">
        <div id="song-strip-list" class="song-strip-list"></div>
      </nav>

      <article class="performance-song" aria-live="polite">
        <div class="song-heading">
          <div>
            <p id="song-position" class="song-position">Música 1 de 1</p>
            <h2 id="song-title">—</h2>
            <p id="song-artist" class="song-artist">—</p>
          </div>
          <div class="song-context">
            <span id="song-minister" class="context-chip"><i class="fas fa-user" aria-hidden="true"></i> Sem ministro</span>
            <span id="song-key" class="context-chip context-chip--key">Tom —</span>
          </div>
        </div>

        <div class="viewer-toolbar" aria-label="Controles de visualização">
          <div class="segmented-control" role="group" aria-label="Conteúdo">
            <button id="view-chords" class="segment-button is-active" type="button" aria-pressed="true">
              <i class="fas fa-guitar" aria-hidden="true"></i> Ver cifra
            </button>
            <button id="view-lyrics" class="segment-button" type="button" aria-pressed="false">
              <i class="fas fa-align-left" aria-hidden="true"></i> Ver letra
            </button>
          </div>

          <div id="transpose-controls" class="toolbar-group" aria-label="Transposição da cifra">
            <span class="toolbar-label">Transpor</span>
            <button id="transpose-down" class="icon-control" type="button" aria-label="Transpor meio tom abaixo">−</button>
            <button id="transpose-reset" class="key-control" type="button" title="Voltar ao tom da execução">Tom <strong id="execution-key">—</strong></button>
            <button id="transpose-up" class="icon-control" type="button" aria-label="Transpor meio tom acima">+</button>
          </div>

          <div class="toolbar-group" aria-label="Tamanho da fonte">
            <span class="toolbar-label">Fonte</span>
            <button id="font-down" class="icon-control" type="button" aria-label="Diminuir fonte">A−</button>
            <output id="font-size-value" class="font-output" aria-live="polite">18px</output>
            <button id="font-up" class="icon-control" type="button" aria-label="Aumentar fonte">A+</button>
          </div>
        </div>

        <div class="content-frame">
          <div id="chords-content" class="music-text music-text--chords" tabindex="0" aria-label="Cifra da música"></div>
          <div id="lyrics-content" class="music-text music-text--lyrics" tabindex="0" aria-label="Letra da música" hidden></div>
          <div id="content-empty" class="content-empty" hidden></div>
        </div>

        <footer id="song-navigation" class="song-navigation">
          <button id="previous-song" class="navigation-button" type="button">
            <i class="fas fa-chevron-left" aria-hidden="true"></i>
            <span><small>Anterior</small><strong id="previous-song-label">Início</strong></span>
          </button>
          <button id="next-song" class="navigation-button navigation-button--next" type="button">
            <span><small>Próxima</small><strong id="next-song-label">Fim</strong></span>
            <i class="fas fa-chevron-right" aria-hidden="true"></i>
          </button>
        </footer>
      </article>
    </section>
  </main>

  <button id="exit-stage-button" class="exit-stage-button" type="button" hidden>
    <i class="fas fa-compress" aria-hidden="true"></i> Sair do modo palco
  </button>

  <noscript>Ative o JavaScript para visualizar cifras e letras do setlist.</noscript>
</body>
</html>

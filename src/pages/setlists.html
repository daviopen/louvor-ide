<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setlists — IDE Music</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="../config/firebase-config.js"></script>
  <script src="../js/modules/auth-service.js?v=20260825-email"></script>
  <script src="../js/modules/app-shell.js?v=20260825-sidebar" defer></script>
  <script src="../js/modules/filter-panel.js?v=20260826-filter-panel" defer></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/design-system.css">
  <link rel="stylesheet" href="../styles/filter-panel.css?v=20260826-filter-panel">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/music-ide-theme.css">
  <style>
    body{background:var(--ide-background);color:var(--ide-text-primary)}
    .setlists-page{max-width:1180px;margin:0 auto;padding:28px 20px 48px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ide-primary)}h1{margin:4px 0 6px;font-size:clamp(1.8rem,3vw,2.45rem)}.muted{color:var(--ide-text-secondary)}
    .filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-size:.82rem;font-weight:750}.field :where(input,select){width:100%;padding:10px 11px;border:1px solid var(--ide-border);border-radius:10px;background:var(--ide-surface);color:var(--ide-text-primary);font:inherit}.filter-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn-primary{background:var(--ide-primary);color:var(--ide-primary-ink)}.btn-secondary{background:var(--ide-surface-secondary);color:var(--ide-text-primary);border:1px solid var(--ide-border)}.btn-disabled{background:var(--ide-surface-secondary);color:var(--ide-text-secondary);border:1px solid var(--ide-border);cursor:not-allowed;opacity:.62}
    .summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:12px 2px}.list{display:grid;gap:12px}.setlist-card{background:var(--ide-surface);border:1px solid var(--ide-border);border-radius:16px;padding:18px;box-shadow:var(--ide-shadow-sm)}.setlist-card__head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.setlist-card__identity{min-width:0}.setlist-card h2{font-size:1.12rem;margin:0 0 7px}.meta{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--ide-text-secondary);font-size:.88rem}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:var(--ide-surface-secondary);border:1px solid var(--ide-border);font-size:.78rem}.status{font-size:.75rem;font-weight:800;padding:5px 8px;border-radius:999px;background:var(--ide-surface-secondary);white-space:nowrap}.setlist-card__actions{margin-top:14px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.empty,.loading{padding:40px 20px;text-align:center;border:1px dashed var(--ide-border);border-radius:16px;color:var(--ide-text-secondary);background:var(--ide-surface)}.loading[hidden]{display:none!important}
    .setlist-dress{display:inline-flex;align-items:center;gap:9px;margin-top:12px;padding:7px 10px;border:1px solid var(--ide-border);border-radius:999px;background:var(--ide-surface-secondary)}.setlist-dress__label{display:inline-flex;align-items:center;gap:6px;color:var(--ide-text-secondary);font-size:.76rem;font-weight:800}.setlist-dress__colors{display:inline-flex;align-items:center;gap:6px}.setlist-dress__swatch{display:inline-block;width:22px;height:22px;border:1px solid var(--ide-border-strong);border-radius:50%;background:var(--dress-color);box-shadow:0 0 0 2px var(--ide-surface);flex:0 0 auto}
    .pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:20px}.pagination button:disabled{opacity:.45;cursor:not-allowed}.readonly-note{font-size:.82rem;color:var(--ide-text-secondary)}
    @media(max-width:820px){.filters{grid-template-columns:1fr 1fr}.page-head{flex-direction:column}.setlist-card__head{flex-direction:column}.setlist-card__actions{justify-content:stretch}.setlist-card__actions :where(.btn,.ide-button){flex:1 1 220px}}
    @media(max-width:560px){.setlists-page{padding:20px 14px 90px}.filters{grid-template-columns:1fr}.summary{align-items:flex-start;flex-direction:column}.setlist-dress{max-width:100%}.setlist-card__actions{display:grid;grid-template-columns:1fr}.setlist-card__actions :where(.btn,.ide-button){width:100%}}
  </style>
</head>
<body>
  <main class="setlists-page">
    <div class="page-head">
      <div><div class="eyebrow">Setlists</div><h1 id="page-title">Próximos Setlists</h1><p id="page-subtitle" class="muted">Repertórios dos próximos eventos e escalas.</p></div>
    </div>

    <details id="setlists-filter-panel" class="ide-filter-panel" data-filter-panel="setlists">
      <summary class="ide-filter-panel__summary">
        <span class="ide-filter-panel__summary-main"><i class="fa-solid fa-sliders" aria-hidden="true"></i> Filtros <span class="ide-filter-panel__badge">0</span></span>
        <span class="ide-filter-panel__summary-meta"><span class="ide-filter-panel__state">Mostrar</span></span>
      </summary>
      <div class="ide-filter-panel__body">
        <section id="filters" class="filters" aria-label="Filtros de Setlists">
          <div class="field"><label for="filter-from">Data inicial</label><input id="filter-from" type="date" data-filter-neutral=""></div>
          <div class="field"><label for="filter-to">Data final</label><input id="filter-to" type="date" data-filter-neutral=""></div>
          <div class="field"><label for="filter-event">Evento</label><select id="filter-event" data-filter-neutral=""><option value="">Todos os eventos</option></select></div>
          <div class="field"><label for="filter-minister">Ministro</label><select id="filter-minister" data-filter-neutral=""><option value="">Todos os ministros</option></select></div>
          <div class="field"><label for="filter-status">Status</label><select id="filter-status" data-filter-neutral=""><option value="">Todos</option><option value="DRAFT">Rascunho</option><option value="READY">Pronto</option><option value="COMPLETED">Concluído</option><option value="CANCELLED">Cancelado</option></select></div>
          <div class="field"><label for="filter-participant">Participante</label><select id="filter-participant" data-filter-neutral=""><option value="">Todos os participantes</option></select></div>
          <div class="field"><label for="filter-song">Música</label><input id="filter-song" type="search" placeholder="Título da música" data-filter-neutral=""></div>
          <div class="field"><label for="filter-theme">Tema</label><input id="filter-theme" type="search" placeholder="Tema do evento" data-filter-neutral=""></div>
          <div class="filter-actions"><button id="clear-filters" class="ide-button ide-button--ghost" type="button"><i class="fa-solid fa-filter-circle-xmark" aria-hidden="true"></i> Limpar filtros</button></div>
        </section>
      </div>
    </details>

    <div class="summary"><strong id="result-count">Carregando…</strong><span id="view-hint" class="readonly-note"></span></div>
    <div id="loading" class="loading" role="status" aria-live="polite"><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i><p>Carregando Setlists…</p></div>
    <div id="setlists-list" class="list" hidden></div>
    <div id="empty-state" class="empty" hidden><i class="fa-solid fa-clipboard-list fa-2x" aria-hidden="true"></i><h2>Nenhum Setlist encontrado</h2><p>Ajuste os filtros ou consulte a outra visão pelo menu.</p></div>
    <div id="pagination" class="pagination" hidden>
      <button id="prev-page" class="ide-button ide-button--secondary" type="button"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i> Anterior</button>
      <span id="page-info"></span>
      <button id="next-page" class="ide-button ide-button--secondary" type="button">Próxima <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
    </div>
  </main>

  <script src="../services/setlist-history-service.js?v=20260831-upcoming-filters"></script>
  <script src="../js/pages/setlists-simple.js?v=20260831-filter-selects"></script>
</body>
</html>

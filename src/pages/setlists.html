<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setlists — IDE Music</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="../config/firebase-config.js"></script>
  <script src="../js/modules/auth-service.js?v=20260825-email"></script>
  <script src="../js/modules/app-shell.js?v=20260825-sidebar" defer></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/music-ide-theme.css">
  <style>
    body{background:var(--background,#f4f7f5);color:var(--text-primary,#1f2924)}
    .setlists-page{max-width:1180px;margin:0 auto;padding:28px 20px 48px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary,#2f6d54)}h1{margin:4px 0 6px;font-size:clamp(1.8rem,3vw,2.45rem)}.muted{color:var(--text-secondary,#63706a)}
    .view-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.view-tab{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;text-decoration:none;border:1px solid var(--border,#d4ddd8);background:var(--surface,#fff);color:var(--text-primary,#1f2924);font-weight:750}.view-tab.active{background:var(--primary,#2f6d54);color:#fff;border-color:var(--primary,#2f6d54)}
    .filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:var(--surface,#fff);border:1px solid var(--border,#d4ddd8);border-radius:16px;padding:16px;margin-bottom:18px}.field{display:grid;gap:6px}.field label{font-size:.82rem;font-weight:750}.field input{width:100%;padding:10px 11px;border:1px solid var(--border,#cad5cf);border-radius:10px;background:var(--surface,#fff);color:var(--text-primary,#1f2924);font:inherit}.filter-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn-primary{background:var(--primary,#2f6d54);color:#fff}.btn-secondary{background:var(--surface-secondary,#edf3ef);color:var(--text-primary,#1f2924);border:1px solid var(--border,#cad5cf)}.btn-disabled{background:var(--surface-secondary,#edf3ef);color:var(--text-secondary,#63706a);border:1px solid var(--border,#cad5cf);cursor:not-allowed;opacity:.62}
    .summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:12px 2px}.list{display:grid;gap:12px}.setlist-card{background:var(--surface,#fff);border:1px solid var(--border,#d4ddd8);border-radius:16px;padding:18px;box-shadow:var(--shadow-sm,0 4px 18px rgba(0,0,0,.05))}.setlist-card__head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.setlist-card h2{font-size:1.12rem;margin:0 0 7px}.meta{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--text-secondary,#63706a);font-size:.88rem}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:var(--surface-secondary,#edf3ef);border:1px solid var(--border,#d4ddd8);font-size:.78rem}.status{font-size:.75rem;font-weight:800;padding:5px 8px;border-radius:999px;background:var(--surface-secondary,#edf3ef);white-space:nowrap}.setlist-card__actions{margin-top:14px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.empty,.loading{padding:40px 20px;text-align:center;border:1px dashed var(--border,#cad5cf);border-radius:16px;color:var(--text-secondary,#63706a);background:var(--surface,#fff)}
    .pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:20px}.pagination button:disabled{opacity:.45;cursor:not-allowed}.readonly-note{font-size:.82rem;color:var(--text-secondary,#63706a)}
    @media(max-width:820px){.filters{grid-template-columns:1fr 1fr}.page-head{flex-direction:column}.setlist-card__head{flex-direction:column}.setlist-card__actions{justify-content:stretch}.setlist-card__actions .btn{flex:1 1 220px}}
    @media(max-width:560px){.setlists-page{padding:20px 14px 90px}.filters{grid-template-columns:1fr}.summary{align-items:flex-start;flex-direction:column}.view-tabs{display:grid;grid-template-columns:1fr 1fr}.view-tab{justify-content:center}.setlist-card__actions{display:grid;grid-template-columns:1fr}.setlist-card__actions .btn{width:100%}}
  </style>
</head>
<body>
  <main class="setlists-page">
    <div class="page-head">
      <div><div class="eyebrow">Setlists</div><h1 id="page-title">Próximos Setlists</h1><p id="page-subtitle" class="muted">Repertórios dos próximos eventos e escalas.</p></div>
    </div>

    <nav class="view-tabs" aria-label="Visões de Setlist">
      <a id="tab-upcoming" class="view-tab" href="setlists.html?view=upcoming"><i class="fas fa-calendar-check"></i> Próximos</a>
      <a id="tab-history" class="view-tab" href="setlists.html?view=history"><i class="fas fa-clock-rotate-left"></i> Histórico</a>
    </nav>

    <section id="filters" class="filters" aria-label="Filtros do Histórico">
      <div class="field"><label for="filter-from">Data inicial</label><input id="filter-from" type="date"></div>
      <div class="field"><label for="filter-to">Data final</label><input id="filter-to" type="date"></div>
      <div class="field"><label for="filter-event">Evento</label><input id="filter-event" type="search" placeholder="Nome do evento"></div>
      <div class="field"><label for="filter-minister">Ministro</label><input id="filter-minister" type="search" placeholder="Nome do ministro"></div>
      <div class="field"><label for="filter-song">Música</label><input id="filter-song" type="search" placeholder="Título da música"></div>
      <div class="field"><label for="filter-theme">Tema</label><input id="filter-theme" type="search" placeholder="Tema do evento"></div>
      <div class="filter-actions"><button id="clear-filters" class="btn btn-secondary" type="button"><i class="fas fa-eraser"></i> Limpar filtros</button></div>
    </section>

    <div class="summary"><strong id="result-count">Carregando…</strong><span id="view-hint" class="readonly-note"></span></div>
    <div id="loading" class="loading"><i class="fas fa-spinner fa-spin"></i><p>Carregando Setlists…</p></div>
    <div id="setlists-list" class="list" hidden></div>
    <div id="empty-state" class="empty" hidden><i class="fas fa-clipboard-list fa-2x"></i><h2>Nenhum Setlist encontrado</h2><p>Ajuste os filtros ou consulte a outra visão.</p></div>
    <div id="pagination" class="pagination" hidden>
      <button id="prev-page" class="btn btn-secondary" type="button"><i class="fas fa-chevron-left"></i> Anterior</button>
      <span id="page-info"></span>
      <button id="next-page" class="btn btn-secondary" type="button">Próxima <i class="fas fa-chevron-right"></i></button>
    </div>
  </main>

  <script src="../services/setlist-history-service.js?v=20260825-roadmap20"></script>
  <script src="../js/pages/setlists-simple.js?v=20260825-actions"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10261f" />
  <title>Consultar músicas — IDE Music</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="../config/firebase-config.js"></script>
  <script src="../js/modules/auth-service.js?v=20260825-email"></script>
  <script src="../js/modules/app-shell.js?v=20260825-sidebar" defer></script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/design-system.css" />
  <link rel="stylesheet" href="../css/music-ide-theme.css" />

  <style>
    body { margin: 0; min-height: 100vh; background: var(--color-background); color: var(--color-text-primary); }
    .songs-page { max-width: 1440px; margin: 0 auto; padding: var(--space-6); }
    .songs-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-5); }
    .songs-header h1 { margin: 0 0 var(--space-1); font-size: clamp(1.55rem, 3vw, 2.2rem); }
    .songs-header p { margin: 0; color: var(--color-text-secondary); }
    .songs-new-button { white-space: nowrap; }
    .songs-layout { display: grid; grid-template-columns: minmax(320px, 0.9fr) minmax(0, 1.5fr); gap: var(--space-5); align-items: start; }
    .songs-panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); }
    .songs-catalog { padding: var(--space-5); }
    .songs-filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); margin-bottom: var(--space-4); }
    .songs-filter--search { grid-column: 1 / -1; }
    .songs-filter label { display: block; margin-bottom: var(--space-1); font-size: .82rem; font-weight: 700; color: var(--color-text-secondary); }
    .songs-filter input, .songs-filter select { width: 100%; min-height: 44px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text-primary); padding: 0 var(--space-3); }
    .songs-filter input:focus, .songs-filter select:focus { outline: 2px solid var(--color-primary); outline-offset: 1px; }
    .songs-filter-actions { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }
    .songs-result-count { font-size: .9rem; color: var(--color-text-secondary); }
    .songs-clear { border: 0; background: transparent; color: var(--color-primary); font-weight: 700; cursor: pointer; padding: var(--space-2); }
    .songs-clear:disabled { opacity: .5; cursor: default; }
    .songs-list { display: grid; gap: var(--space-2); }
    .song-row { width: 100%; text-align: left; border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface-secondary); color: var(--color-text-primary); padding: var(--space-3); cursor: pointer; transition: border-color .18s ease, transform .18s ease, background .18s ease; }
    .song-row:hover { border-color: var(--color-primary); transform: translateY(-1px); }
    .song-row[aria-current="true"] { border-color: var(--color-primary); background: color-mix(in srgb, var(--color-primary) 12%, var(--color-surface)); }
    .song-row__title { display: block; font-weight: 800; margin-bottom: 3px; }
    .song-row__meta { display: flex; flex-wrap: wrap; gap: var(--space-2); font-size: .82rem; color: var(--color-text-secondary); }
    .songs-pagination { display: flex; align-items: center; justify-content: center; gap: var(--space-3); margin-top: var(--space-4); }
    .songs-pagination button { min-height: 40px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text-primary); padding: 0 var(--space-3); cursor: pointer; }
    .songs-pagination button:disabled { opacity: .45; cursor: default; }
    .songs-pagination__label { min-width: 96px; text-align: center; font-size: .88rem; color: var(--color-text-secondary); }
    .songs-viewer { min-height: 520px; padding: var(--space-5); position: sticky; top: var(--space-4); }
    .songs-empty { min-height: 420px; display: grid; place-items: center; text-align: center; color: var(--color-text-secondary); padding: var(--space-6); }
    .songs-empty i { display: block; font-size: 2.3rem; margin-bottom: var(--space-3); color: var(--color-primary); }
    .song-detail[hidden] { display: none; }
    .song-detail__header { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4); padding-bottom: var(--space-4); border-bottom: 1px solid var(--color-border); }
    .song-detail__header h2 { margin: 0 0 var(--space-1); font-size: clamp(1.4rem, 3vw, 2rem); }
    .song-detail__artist { color: var(--color-text-secondary); }
    .song-detail__meta { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-4) 0; }
    .song-chip { border: 1px solid var(--color-border); background: var(--color-surface-secondary); border-radius: 999px; padding: var(--space-2) var(--space-3); font-size: .84rem; }
    .song-cifra { margin: 0; min-height: 320px; max-height: 58vh; overflow: auto; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; line-height: 1.75; background: var(--color-surface-secondary); color: var(--color-text-primary); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-4); }
    .songs-loading { text-align: center; padding: var(--space-6); color: var(--color-text-secondary); }
    .songs-loading[hidden] { display: none; }

    @media (max-width: 900px) {
      .songs-page { padding: var(--space-4); }
      .songs-layout { grid-template-columns: 1fr; }
      .songs-viewer { position: static; min-height: auto; }
    }
    @media (max-width: 600px) {
      .songs-header { align-items: stretch; flex-direction: column; }
      .songs-new-button { width: 100%; justify-content: center; }
      .songs-catalog, .songs-viewer { padding: var(--space-4); }
      .songs-filters { grid-template-columns: 1fr; }
      .songs-filter--search { grid-column: auto; }
      .songs-filter-actions { align-items: flex-start; flex-direction: column; }
      .songs-clear { padding-left: 0; }
      .song-detail__header { flex-direction: column; }
      .song-row__meta { gap: 6px 10px; }
      .songs-pagination { justify-content: space-between; }
    }
  </style>
</head>
<body>
  <main class="songs-page" id="songs-page">
    <header class="songs-header">
      <div>
        <h1>Consultar músicas</h1>
        <p>Encontre rapidamente o repertório por nome, artista, ministro, tom ou tema.</p>
      </div>
      <a class="ide-button ide-button--primary ide-button--md songs-new-button" href="nova-musica.html">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
        Nova Música
      </a>
    </header>

    <div class="songs-layout">
      <section class="songs-panel songs-catalog" aria-labelledby="catalog-title">
        <h2 id="catalog-title" class="sr-only">Catálogo de músicas</h2>
        <div class="songs-filters" aria-label="Filtros do catálogo">
          <div class="songs-filter songs-filter--search">
            <label for="song-search">Nome da música</label>
            <input id="song-search" type="search" autocomplete="off" placeholder="Buscar por nome..." />
          </div>
          <div class="songs-filter">
            <label for="song-artist-filter">Artista</label>
            <select id="song-artist-filter"><option value="">Todos</option></select>
          </div>
          <div class="songs-filter">
            <label for="song-minister-filter">Ministro</label>
            <select id="song-minister-filter"><option value="">Todos</option></select>
          </div>
          <div class="songs-filter">
            <label for="song-key-filter">Tom</label>
            <select id="song-key-filter"><option value="">Todos</option></select>
          </div>
          <div class="songs-filter">
            <label for="song-theme-filter">Tema</label>
            <select id="song-theme-filter"><option value="">Todos</option></select>
          </div>
        </div>

        <div class="songs-filter-actions">
          <div id="songs-result-count" class="songs-result-count" aria-live="polite">Carregando repertório...</div>
          <button type="button" id="songs-clear-filters" class="songs-clear" disabled>Limpar filtros</button>
        </div>

        <div id="songs-loading" class="songs-loading" role="status">Carregando músicas...</div>
        <div id="songs-list" class="songs-list" aria-live="polite"></div>
        <nav id="songs-pagination" class="songs-pagination" aria-label="Paginação das músicas" hidden>
          <button type="button" id="songs-prev-page"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i> Anterior</button>
          <span id="songs-page-label" class="songs-pagination__label"></span>
          <button type="button" id="songs-next-page">Próxima <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
        </nav>
      </section>

      <section class="songs-panel songs-viewer" aria-live="polite">
        <div id="songs-empty-viewer" class="songs-empty">
          <div>
            <i class="fa-solid fa-music" aria-hidden="true"></i>
            <h2>Selecione uma música</h2>
            <p>Os detalhes e a cifra aparecerão aqui.</p>
          </div>
        </div>

        <article id="song-detail" class="song-detail" hidden>
          <div class="song-detail__header">
            <div>
              <h2 id="song-detail-title"></h2>
              <div id="song-detail-artist" class="song-detail__artist"></div>
            </div>
            <a id="song-detail-link" class="ide-button ide-button--secondary ide-button--sm" href="#" target="_blank" rel="noopener noreferrer" hidden>
              <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> Referência
            </a>
          </div>
          <div id="song-detail-meta" class="song-detail__meta"></div>
          <pre id="song-detail-cifra" class="song-cifra"></pre>
        </article>
      </section>
    </div>
  </main>

  <script type="module" src="../js/pages/consulta.js?v=20260825-catalog"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10261f" />
  <title>Consultar músicas — IDE Music</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="../config/firebase-config.js"></script>
  <script src="../js/modules/auth-service.js?v=20260825-email"></script>
  <script src="../js/modules/app-shell.js?v=20260825-sidebar" defer></script>
  <script src="../js/modules/filter-panel.js?v=20260826-filter-panel" defer></script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/design-system.css" />
  <link rel="stylesheet" href="../styles/filter-panel.css?v=20260826-filter-panel" />
  <link rel="stylesheet" href="../css/music-ide-theme.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--ide-background); color: var(--ide-text-primary); font-family: var(--ide-font-family-sans); }
    .songs-page { width: min(1440px, 100%); margin: 0 auto; padding: var(--ide-space-6); }
    .songs-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--ide-space-4); margin-bottom: var(--ide-space-5); }
    .songs-header h1 { margin: 0 0 var(--ide-space-1); color: var(--ide-text-primary); font-size: var(--ide-font-size-2xl); line-height: var(--ide-line-height-tight); }
    .songs-header p { margin: 0; color: var(--ide-text-secondary); line-height: var(--ide-line-height-normal); }
    .songs-new-button { white-space: nowrap; text-decoration: none; }
    .songs-layout { display: grid; grid-template-columns: minmax(360px, .92fr) minmax(0, 1.45fr); gap: var(--ide-space-5); align-items: start; }
    .songs-panel { min-width: 0; background: var(--ide-surface); border: 1px solid var(--ide-border); border-radius: var(--ide-radius-xl); box-shadow: var(--ide-shadow-sm); }
    .songs-catalog { padding: var(--ide-space-5); }
    .songs-filter-panel { margin-bottom: var(--ide-space-4); }
    .songs-filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ide-space-3); }
    .songs-filter--search { grid-column: 1 / -1; }
    .songs-filter label { display: block; margin-bottom: var(--ide-space-1); font-size: var(--ide-font-size-sm); font-weight: var(--ide-font-weight-bold); color: var(--ide-text-secondary); }
    .songs-filter input, .songs-filter select { width: 100%; min-height: 44px; border: 1px solid var(--ide-border); border-radius: var(--ide-radius-md); background: var(--ide-surface); color: var(--ide-text-primary); padding: 0 var(--ide-space-3); font: inherit; }
    .songs-filter input:focus-visible, .songs-filter select:focus-visible { outline: 3px solid var(--ide-focus-ring); outline-offset: 1px; border-color: var(--ide-primary); }
    .songs-filter-actions { display: flex; align-items: center; justify-content: space-between; gap: var(--ide-space-3); min-height: 40px; margin-bottom: var(--ide-space-4); padding-bottom: var(--ide-space-3); border-bottom: 1px solid var(--ide-border); }
    .songs-result-count { font-size: var(--ide-font-size-sm); color: var(--ide-text-secondary); }
    .songs-clear { border: 0; border-radius: var(--ide-radius-sm); background: transparent; color: var(--ide-secondary); font: inherit; font-weight: var(--ide-font-weight-bold); cursor: pointer; padding: var(--ide-space-2); }
    .songs-clear:hover:not(:disabled) { background: var(--ide-surface-secondary); }
    .songs-clear:focus-visible { outline: 3px solid var(--ide-focus-ring); outline-offset: 1px; }
    .songs-clear:disabled { opacity: .45; cursor: default; }
    .songs-list { display: grid; gap: var(--ide-space-2); }
    .song-row { width: 100%; text-align: left; border: 1px solid var(--ide-border); border-radius: var(--ide-radius-lg); background: var(--ide-surface-secondary); color: var(--ide-text-primary); padding: var(--ide-space-3); font: inherit; cursor: pointer; transition: border-color .18s ease, transform .18s ease, background .18s ease; }
    .song-row:hover { border-color: var(--ide-secondary); transform: translateY(-1px); }
    .song-row:focus-visible { outline: 3px solid var(--ide-focus-ring); outline-offset: 1px; }
    .song-row[aria-current="true"] { border-color: var(--ide-primary-active); background: color-mix(in srgb, var(--ide-primary) 15%, var(--ide-surface)); }
    .song-row__title { display: block; font-weight: var(--ide-font-weight-extrabold); margin-bottom: 4px; }
    .song-row__meta { display: flex; flex-wrap: wrap; gap: var(--ide-space-2); font-size: var(--ide-font-size-sm); color: var(--ide-text-secondary); }
    .song-row__meta span + span::before { content: '•'; margin-right: var(--ide-space-2); opacity: .6; }
    .songs-pagination { display: flex; align-items: center; justify-content: center; gap: var(--ide-space-3); margin-top: var(--ide-space-4); padding-top: var(--ide-space-4); border-top: 1px solid var(--ide-border); }
    .songs-pagination button { min-height: 40px; border: 1px solid var(--ide-border); border-radius: var(--ide-radius-md); background: var(--ide-surface); color: var(--ide-text-primary); padding: 0 var(--ide-space-3); font: inherit; font-weight: var(--ide-font-weight-medium); cursor: pointer; }
    .songs-pagination button:hover:not(:disabled) { border-color: var(--ide-secondary); background: var(--ide-surface-secondary); }
    .songs-pagination button:focus-visible { outline: 3px solid var(--ide-focus-ring); outline-offset: 1px; }
    .songs-pagination button:disabled { opacity: .45; cursor: default; }
    .songs-pagination__label { min-width: 110px; text-align: center; font-size: var(--ide-font-size-sm); color: var(--ide-text-secondary); }
    .songs-viewer { min-height: 520px; padding: var(--ide-space-5); position: sticky; top: var(--ide-space-4); }
    .songs-empty { min-height: 300px; display: grid; place-items: center; text-align: center; color: var(--ide-text-secondary); padding: var(--ide-space-6); }
    .songs-empty[hidden] { display: none !important; }
    .songs-viewer > .songs-empty { min-height: 470px; }
    .songs-empty i { display: block; font-size: 2.3rem; margin-bottom: var(--ide-space-3); color: var(--ide-secondary); }
    .songs-empty h2, .songs-empty h3 { margin: 0 0 var(--ide-space-2); color: var(--ide-text-primary); }
    .songs-empty p { margin: 0 0 var(--ide-space-4); line-height: var(--ide-line-height-normal); }
    .song-detail[hidden] { display: none; }
    .song-detail__header { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--ide-space-4); padding-bottom: var(--ide-space-4); border-bottom: 1px solid var(--ide-border); }
    .song-detail__header h2 { margin: 0 0 var(--ide-space-1); font-size: var(--ide-font-size-2xl); }
    .song-detail__artist { color: var(--ide-text-secondary); }
    .song-detail__actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--ide-space-2); }
    .song-detail__meta { display: flex; flex-wrap: wrap; gap: var(--ide-space-2); margin: var(--ide-space-4) 0; }
    .song-chip { border: 1px solid var(--ide-border); background: var(--ide-surface-secondary); border-radius: var(--ide-radius-pill); padding: var(--ide-space-2) var(--ide-space-3); font-size: var(--ide-font-size-sm); }
    .song-cifra { margin: 0; min-height: 320px; max-height: 58vh; overflow: auto; white-space: pre-wrap; font-family: var(--ide-font-family-mono); line-height: 1.75; background: var(--ide-surface-secondary); color: var(--ide-text-primary); border: 1px solid var(--ide-border); border-radius: var(--ide-radius-lg); padding: var(--ide-space-4); }
    .songs-loading { display: flex; align-items: center; justify-content: center; gap: var(--ide-space-3); min-height: 110px; text-align: center; color: var(--ide-text-secondary); }
    .songs-loading::before { content: ''; width: 20px; height: 20px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: ide-spin .7s linear infinite; }
    .songs-loading[hidden] { display: none; }

    @media (max-width: 900px) {
      .songs-page { padding: var(--ide-space-4); padding-bottom: calc(var(--ide-space-16) + env(safe-area-inset-bottom)); }
      .songs-layout { grid-template-columns: 1fr; }
      .songs-viewer { position: static; min-height: auto; }
      .songs-viewer > .songs-empty { min-height: 220px; }
    }
    @media (max-width: 600px) {
      .songs-header { align-items: stretch; flex-direction: column; }
      .songs-new-button { width: 100%; justify-content: center; }
      .songs-catalog, .songs-viewer { padding: var(--ide-space-4); }
      .songs-filters { grid-template-columns: 1fr; }
      .songs-filter--search { grid-column: auto; }
      .songs-filter-actions { align-items: center; }
      .song-detail__header { flex-direction: column; }
      .song-detail__actions { width: 100%; justify-content: stretch; }
      .song-detail__actions .ide-button { flex: 1 1 auto; justify-content: center; }
      .song-row__meta { gap: 6px 10px; }
      .song-row__meta span + span::before { content: none; }
      .songs-pagination { justify-content: space-between; gap: var(--ide-space-2); }
      .songs-pagination button { padding: 0 var(--ide-space-2); }
    }
  </style>
</head>
<body>
  <main class="songs-page" id="songs-page">
    <header class="songs-header">
      <div>
        <h1>Consultar músicas</h1>
        <p>Encontre rapidamente o repertório por nome, artista, ministro, tom ou tema.</p>
      </div>
      <a class="ide-button ide-button--primary ide-button--md songs-new-button" href="nova-musica.html">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
        Nova Música
      </a>
    </header>

    <div class="songs-layout">
      <section class="songs-panel songs-catalog" aria-labelledby="catalog-title">
        <h2 id="catalog-title" class="sr-only">Catálogo de músicas</h2>

        <details id="songs-filter-panel" class="ide-filter-panel songs-filter-panel" data-filter-panel="songs">
          <summary class="ide-filter-panel__summary">
            <span class="ide-filter-panel__summary-main"><i class="fa-solid fa-sliders" aria-hidden="true"></i> Filtros <span class="ide-filter-panel__badge">0</span></span>
            <span class="ide-filter-panel__summary-meta"><span class="ide-filter-panel__state">Mostrar</span></span>
          </summary>
          <div class="ide-filter-panel__body">
            <div class="songs-filters" aria-label="Filtros do catálogo">
              <div class="songs-filter songs-filter--search">
                <label for="song-search">Nome da música</label>
                <input id="song-search" type="search" autocomplete="off" placeholder="Buscar por nome..." data-filter-neutral="" />
              </div>
              <div class="songs-filter">
                <label for="song-artist-filter">Artista</label>
                <select id="song-artist-filter" data-filter-neutral=""><option value="">Todos</option></select>
              </div>
              <div class="songs-filter">
                <label for="song-minister-filter">Ministro</label>
                <select id="song-minister-filter" data-filter-neutral=""><option value="">Todos</option></select>
              </div>
              <div class="songs-filter">
                <label for="song-key-filter">Tom</label>
                <select id="song-key-filter" data-filter-neutral=""><option value="">Todos</option></select>
              </div>
              <div class="songs-filter">
                <label for="song-theme-filter">Tema</label>
                <select id="song-theme-filter" data-filter-neutral=""><option value="">Todos</option></select>
              </div>
            </div>
          </div>
        </details>

        <div class="songs-filter-actions">
          <div id="songs-result-count" class="songs-result-count" aria-live="polite">Carregando repertório...</div>
          <button type="button" id="songs-clear-filters" class="songs-clear" disabled>Limpar filtros</button>
        </div>

        <div id="songs-loading" class="songs-loading" role="status">Carregando músicas...</div>
        <div id="songs-list" class="songs-list" aria-live="polite"></div>
        <nav id="songs-pagination" class="songs-pagination" aria-label="Paginação das músicas" hidden>
          <button type="button" id="songs-prev-page"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i> Anterior</button>
          <span id="songs-page-label" class="songs-pagination__label"></span>
          <button type="button" id="songs-next-page">Próxima <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
        </nav>
      </section>

      <section class="songs-panel songs-viewer" aria-live="polite" aria-label="Detalhes da música selecionada">
        <div id="songs-empty-viewer" class="songs-empty">
          <div>
            <i class="fa-solid fa-music" aria-hidden="true"></i>
            <h2>Selecione uma música</h2>
            <p>Os detalhes e a cifra aparecerão aqui.</p>
          </div>
        </div>

        <article id="song-detail" class="song-detail" hidden>
          <div class="song-detail__header">
            <div>
              <h2 id="song-detail-title"></h2>
              <div id="song-detail-artist" class="song-detail__artist"></div>
            </div>
            <div class="song-detail__actions" aria-label="Ações da música">
              <a id="song-detail-stage" class="ide-button ide-button--primary ide-button--sm" href="#">
                <i class="fa-solid fa-expand" aria-hidden="true"></i> Modo palco
              </a>
              <a id="song-detail-edit" class="ide-button ide-button--secondary ide-button--sm" href="#" hidden>
                <i class="fa-solid fa-pen" aria-hidden="true"></i> Editar
              </a>
              <a id="song-detail-link" class="ide-button ide-button--secondary ide-button--sm" href="#" target="_blank" rel="noopener noreferrer" hidden>
                <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> Referência
              </a>
            </div>
          </div>
          <div id="song-detail-meta" class="song-detail__meta"></div>
          <pre id="song-detail-cifra" class="song-cifra"></pre>
        </article>
      </section>
    </div>
  </main>

  <script type="module" src="../js/pages/consulta.js?v=20260826-details-stage"></script>
</body>
</html>

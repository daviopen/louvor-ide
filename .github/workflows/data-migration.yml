name: 🗃️ Data Migration

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Migration mode
        required: true
        default: verify
        type: choice
        options:
          - dry-run
          - apply
          - verify

concurrency:
  group: data-migration-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save firebase-admin@13.4.0

      - name: Authenticate Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: Resolve migration mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=apply" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run migration
        env:
          GOOGLE_CLOUD_PROJECT: louvor-ide
          GCLOUD_PROJECT: louvor-ide
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.mode.outputs.value }}" in
            apply) node src/scripts/migrate-legacy-data.cjs --apply ;;
            verify) node src/scripts/migrate-legacy-data.cjs --verify ;;
            dry-run) node src/scripts/migrate-legacy-data.cjs --dry-run ;;
            *) echo "Invalid migration mode"; exit 2 ;;
          esac

      - name: Verify migration after apply
        if: steps.mode.outputs.value == 'apply'
        env:
          GOOGLE_CLOUD_PROJECT: louvor-ide
          GCLOUD_PROJECT: louvor-ide
        run: node src/scripts/migrate-legacy-data.cjs --verify

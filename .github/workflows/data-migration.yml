name: 🗃️ Data Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Migration mode
        required: true
        default: verify
        type: choice
        options:
          - dry-run
          - apply
          - verify
      confirm_production:
        description: 'Para apply, digite LOUVOR-IDE-PRODUCTION'
        required: false
        default: ''
        type: string

concurrency:
  group: data-migration-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛡️ Confirmar escrita em produção
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_production }}" = "LOUVOR-IDE-PRODUCTION" || {
            echo '❌ Apply bloqueado. Informe LOUVOR-IDE-PRODUCTION em confirm_production.'
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save firebase-admin@13.4.0

      - name: Authenticate Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: Run migration
        env:
          GOOGLE_CLOUD_PROJECT: louvor-ide
          GCLOUD_PROJECT: louvor-ide
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.mode }}" in
            apply) node src/scripts/migrate-legacy-data.cjs --apply ;;
            verify) node src/scripts/migrate-legacy-data.cjs --verify ;;
            dry-run) node src/scripts/migrate-legacy-data.cjs --dry-run ;;
            *) echo "Invalid migration mode"; exit 2 ;;
          esac

      - name: Verify migration after apply
        if: inputs.mode == 'apply'
        env:
          GOOGLE_CLOUD_PROJECT: louvor-ide
          GCLOUD_PROJECT: louvor-ide
        run: node src/scripts/migrate-legacy-data.cjs --verify

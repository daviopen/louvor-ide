name: ✅ Quality Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Firestore Rules tests
        run: npx firebase emulators:exec --only firestore --project demo-louvor-ide "node --test tests/firestore-rules.test.js"

      - name: Repository safety checks
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude='.env.example' --exclude-dir='.git' '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|FIREBASE_SERVICE_ACCOUNT.*\{)' .; then
            echo 'Potential secret material found in repository.'
            exit 1
          fi
          if grep -RInE --include='*.js' --include='*.cjs' --include='*.json' '(password\s*[:=]\s*["'\''`][^"'\''`]+|accessToken\s*[:=]\s*["'\''`][^"'\''`]+)' src ops; then
            echo 'Potential credential persisted in source.'
            exit 1
          fi
          echo 'Repository safety checks passed.'

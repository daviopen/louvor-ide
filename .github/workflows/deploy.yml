name: Deploy

on:
  workflow_run:
    workflows:
      - "Tests"
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Normalize authentication domain
        env:
          FIREBASE_HOSTING_AUTH_DOMAIN: louvor-ide.web.app
        run: node src/scripts/normalize-auth-domain.js js/env-config.js "$FIREBASE_HOSTING_AUTH_DOMAIN"

      - name: Normalize built HTML
        run: node src/scripts/normalize-built-html-colors.js .

      - name: Compose Firestore Rules
        run: node src/scripts/build-firestore-rules.cjs firestore.rules firestore.notifications.rules /tmp/firestore.rules

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: Publish Firestore Rules
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth application-default print-access-token)"
          RULESET_PAYLOAD="$(jq -n --rawfile content /tmp/firestore.rules '{source:{files:[{name:"firestore.rules",content:$content}]}}')"
          RULESET_RESPONSE="$(curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${RULESET_PAYLOAD}" \
            "https://firebaserules.googleapis.com/v1/projects/louvor-ide/rulesets")"
          RULESET_NAME="$(printf '%s' "${RULESET_RESPONSE}" | jq -er '.name')"
          RELEASE_NAME="projects/louvor-ide/releases/cloud.firestore"
          RELEASE_URL="https://firebaserules.googleapis.com/v1/${RELEASE_NAME}"
          STATUS="$(curl -sS -o /tmp/firestore-release.json -w '%{http_code}' \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${RELEASE_URL}")"

          if [ "${STATUS}" = "200" ]; then
            RELEASE_PAYLOAD="$(jq -n --arg release "${RELEASE_NAME}" --arg ruleset "${RULESET_NAME}" '{release:{name:$release,rulesetName:$ruleset},updateMask:"rulesetName"}')"
            curl --fail-with-body -sS \
              -X PATCH \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${RELEASE_PAYLOAD}" \
              "${RELEASE_URL}" >/tmp/firestore-release-updated.json
          else
            RELEASE_PAYLOAD="$(jq -n --arg release "${RELEASE_NAME}" --arg ruleset "${RULESET_NAME}" '{name:$release,rulesetName:$ruleset}')"
            curl --fail-with-body -sS \
              -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${RELEASE_PAYLOAD}" \
              "https://firebaserules.googleapis.com/v1/projects/louvor-ide/releases" >/tmp/firestore-release-created.json
          fi

          VERIFIED_RULESET="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${RELEASE_URL}" | jq -er '.rulesetName')"
          test "${VERIFIED_RULESET}" = "${RULESET_NAME}"
          echo "Firestore Rules published."

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}
          channelId: live
          projectId: louvor-ide

      - name: Post-deploy smoke test
        run: |
          set -euo pipefail
          sleep 10
          for url in \
            https://louvor-ide.web.app/ \
            https://louvor-ide.web.app/login.html \
            https://louvor-ide.web.app/help.html \
            https://louvor-ide.web.app/styles/tokens.css \
            https://louvor-ide.web.app/js/modules/auth-service.js \
            https://louvor-ide.web.app/js/modules/mobile-auth-compat.js \
            https://louvor-ide.web.app/js/modules/notification-push.js \
            https://louvor-ide.web.app/repositories/notification-outbox-repository.js
          do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$url")"
            test "$status" = "200" || { echo "$url returned HTTP $status"; exit 1; }
            echo "$url OK"
          done
          curl --fail-with-body -sS https://louvor-ide.web.app/help.html -o /tmp/help.html
          grep -q "Como informar uma indisponibilidade" /tmp/help.html || { echo 'Public help page was not deployed.'; exit 1; }
          curl --fail-with-body -sS https://louvor-ide.web.app/js/env-config.js -o /tmp/env-config.js
          grep -q "VITE_FIREBASE_AUTH_DOMAIN: 'louvor-ide.web.app'" /tmp/env-config.js || { echo 'First-party auth domain was not deployed.'; exit 1; }
          curl --fail-with-body -sS https://louvor-ide.web.app/__/firebase/init.json -o /tmp/firebase-init.json
          jq -e '.projectId == "louvor-ide"' /tmp/firebase-init.json >/dev/null || { echo 'Firebase Hosting points to an unexpected project.'; exit 1; }
          echo "Smoke test passed."

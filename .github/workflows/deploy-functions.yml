name: 🔐 Deploy user management function

on:
  push:
    branches: [main, master]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy_function:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Validar dependências da Function
        run: npm install --prefix functions

      - name: 🔑 Autenticar service account Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: 🚀 Publicar função administrativa
        run: npx --yes firebase-tools@15.28.1 deploy --only functions:adminUserManagement --project louvor-ide --non-interactive

      - name: 🔍 Validar endpoint publicado
        run: |
          set -euo pipefail
          endpoint='https://us-central1-louvor-ide.cloudfunctions.net/adminUserManagement'
          status=$(curl -sS -o /tmp/function-response.txt -w '%{http_code}' -X OPTIONS -H 'Origin: https://louvor-ide.web.app' "$endpoint")
          test "$status" = "204"
          echo '✅ Function administrativa publicada e respondendo CORS em produção'

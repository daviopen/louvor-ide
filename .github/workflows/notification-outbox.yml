name: 🔔 Notification Outbox

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: notification-outbox-production
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install worker dependencies
        run: |
          npm ci
          npm install --no-save firebase-admin@13.4.0 web-push@3.6.7

      - name: Authenticate Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: Deliver pending notifications
        env:
          GOOGLE_CLOUD_PROJECT: louvor-ide
          GCLOUD_PROJECT: louvor-ide
          IDE_MUSIC_APP_URL: https://louvor-ide.web.app
          NOTIFICATION_BATCH_SIZE: '25'
          NOTIFICATION_MAX_ATTEMPTS: '5'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_FROM: ${{ vars.NOTIFICATION_EMAIL_FROM }}
        run: node src/scripts/process-notification-outbox.cjs

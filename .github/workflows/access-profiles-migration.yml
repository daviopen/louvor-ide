name: 👥 Access Profiles Migration

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Aplicar associações inferidas (false = apenas dry-run)'
        required: true
        default: false
        type: boolean

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar dependências
        run: |
          npm ci
          npm install --no-save firebase-admin@13.4.0

      - name: 🔑 Autenticar Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: 👥 Migrar perfis de acesso
        env:
          GCLOUD_PROJECT: louvor-ide
          APPLY_ACCESS_PROFILE_MIGRATION: ${{ inputs.apply }}
        run: node src/scripts/migrate-access-profiles.cjs

name: 🤖 Music AI Mock E2E

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/js/pages/song-form.js'
      - 'src/services/music-ai-*.js'
      - 'src/styles/music-ai-import.css'
      - 'src/repositories/music-repository.js'
      - 'tests/music-ai-*.js'
      - 'tests/music-ai-*.cjs'
      - '.github/workflows/music-ai-mock-e2e.yml'
      - 'Makefile'

concurrency:
  group: music-ai-mock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  music_ai_mock_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build branch under test
        env:
          # O harness não inicializa Firebase. Valores não sensíveis apenas satisfazem
          # o contrato do build e mantêm este E2E independente de produção/quota/secrets.
          VITE_FIREBASE_API_KEY: e2e-public-api-key
          VITE_FIREBASE_AUTH_DOMAIN: e2e.invalid
          VITE_FIREBASE_PROJECT_ID: e2e-music-ai
          VITE_FIREBASE_STORAGE_BUCKET: e2e.invalid
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: e2e-app-id
          VITE_FIREBASE_MEASUREMENT_ID: e2e-measurement-id
          VITE_FIREBASE_APPCHECK_SITE_KEY: ''
          VITE_FIREBASE_AI_MODEL: gemini-3.5-flash-lite
        run: npm run build

      - name: 🌐 Install Playwright
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: 🌐 Start isolated static preview
        run: |
          set -euo pipefail
          python3 -m http.server 5000 --bind 127.0.0.1 > /tmp/music-ai-static.log 2>&1 &
          echo $! > /tmp/music-ai-static.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/nova-musica.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/music-ai-static.log
          exit 1

      - name: 🎭 Run mocked provider E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:5000
        run: node tests/music-ai-mock.e2e.cjs

      - name: 📜 Print preview log on failure
        if: failure()
        run: cat /tmp/music-ai-static.log || true

      - name: 🧹 Stop isolated preview
        if: always()
        run: |
          if [ -f /tmp/music-ai-static.pid ]; then
            kill "$(cat /tmp/music-ai-static.pid)" 2>/dev/null || true
          fi

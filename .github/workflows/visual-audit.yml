name: 🖼️ Visual audit production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}
      - name: Install audit dependencies
        run: |
          npm install --no-save playwright@1.55.0 firebase-admin@13.4.0
          npx playwright install --with-deps chromium
      - name: Capture desktop/mobile and audit UI
        env:
          BASE_URL: https://louvor-ide.web.app
        run: |
          cat > visual-audit.cjs <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const admin = require('firebase-admin');
          const { chromium } = require('playwright');

          const baseUrl = process.env.BASE_URL;
          const out = path.resolve('visual-audit');
          fs.mkdirSync(out, { recursive: true });
          admin.initializeApp({ credential: admin.credential.applicationDefault(), projectId: 'louvor-ide' });
          const db = admin.firestore();
          const auth = admin.auth();
          const email = `visual.audit.${Date.now()}@louvor-ide.app`;
          const password = `Va!${Date.now()}Aa9`;
          let user;
          let browser;

          function luminance([r,g,b]) {
            const f = v => { v/=255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); };
            const [R,G,B] = [f(r),f(g),f(b)]; return .2126*R+.7152*G+.0722*B;
          }
          function parseRgb(value) {
            const m = String(value||'').match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)/i); return m ? [+m[1],+m[2],+m[3]] : null;
          }
          function ratio(a,b) { const x=luminance(a), y=luminance(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); }

          async function auditPage(page, label, viewport, theme) {
            await page.evaluate(t => localStorage.setItem('musicIdeTheme', t), theme);
            await page.reload({ waitUntil: 'networkidle', timeout: 45000 }).catch(()=>{});
            await page.waitForTimeout(1200);
            const safe = `${label}-${viewport.name}-${theme}`.replace(/[^a-z0-9-]+/gi,'_');
            await page.screenshot({ path: path.join(out, `${safe}.png`), fullPage: true });
            const findings = await page.evaluate(() => {
              const vis = el => {
                const s=getComputedStyle(el), r=el.getBoundingClientRect();
                return s.display!=='none' && s.visibility!=='hidden' && +s.opacity!==0 && r.width>0 && r.height>0;
              };
              const touch=[]; document.querySelectorAll('button,a,input,select,textarea,[role="button"]').forEach(el=>{
                if(!vis(el)) return; const r=el.getBoundingClientRect();
                if(r.width<44 || r.height<44) touch.push({tag:el.tagName,id:el.id||'',cls:String(el.className||'').slice(0,120),text:(el.innerText||el.value||el.getAttribute('aria-label')||'').trim().slice(0,70),w:Math.round(r.width),h:Math.round(r.height)});
              });
              const clipped=[]; document.querySelectorAll('button,a,th,td,label,h1,h2,h3,p,span').forEach(el=>{
                if(!vis(el)) return;
                if(el.scrollWidth>el.clientWidth+3 && getComputedStyle(el).overflowX!=='visible') clipped.push({tag:el.tagName,id:el.id||'',cls:String(el.className||'').slice(0,100),text:(el.innerText||'').trim().slice(0,80),scrollWidth:el.scrollWidth,clientWidth:el.clientWidth});
              });
              const viewportOverflow = document.documentElement.scrollWidth > document.documentElement.clientWidth + 3;
              const candidates=[]; document.querySelectorAll('button,a,.ide-button,.badge,.status-badge,.music-ide-signout').forEach(el=>{
                if(!vis(el)) return; const s=getComputedStyle(el); candidates.push({tag:el.tagName,id:el.id||'',cls:String(el.className||'').slice(0,100),text:(el.innerText||'').trim().slice(0,70),color:s.color,bg:s.backgroundColor,fontSize:parseFloat(s.fontSize)||16,fontWeight:s.fontWeight});
              });
              return { viewportOverflow, touch, clipped, candidates };
            });
            const contrast=[];
            for (const c of findings.candidates) {
              const fg=parseRgb(c.color), bg=parseRgb(c.bg); if(!fg||!bg||/rgba\([^)]*,\s*0\)/.test(c.bg)) continue;
              const cr=ratio(fg,bg); const large=c.fontSize>=24 || (c.fontSize>=18.66 && Number(c.fontWeight)>=700); const min=large?3:4.5;
              if(cr<min) contrast.push({...c,ratio:+cr.toFixed(2),required:min});
            }
            delete findings.candidates;
            return {...findings, contrast};
          }

          (async()=>{
            const report={generatedAt:new Date().toISOString(),baseUrl,items:[]};
            try {
              user = await auth.createUser({ email, password, displayName: 'Visual Audit', emailVerified: true });
              await auth.setCustomUserClaims(user.uid,{superAdmin:true,role:'SUPER_ADMIN'});
              await db.collection('users').doc(user.uid).set({uid:user.uid,email,name:'Visual Audit',displayName:'Visual Audit',role:'SUPER_ADMIN',active:true,createdAt:admin.firestore.FieldValue.serverTimestamp(),updatedAt:admin.firestore.FieldValue.serverTimestamp()});
              let setlistId='';
              const setlists=await db.collection('setlists').limit(1).get(); if(!setlists.empty) setlistId=setlists.docs[0].id;
              browser=await chromium.launch({headless:true});
              const context=await browser.newContext({viewport:{width:1440,height:1000}});
              const page=await context.newPage();
              await page.goto(`${baseUrl}/login.html`,{waitUntil:'networkidle',timeout:45000});
              await page.fill('#login-email',email); await page.fill('#login-password',password); await page.click('.email-button');
              await page.waitForURL(url=>!url.pathname.endsWith('/login.html'),{timeout:30000}); await page.waitForTimeout(1500);
              const routes=[
                ['dashboard','/index.html'],['users','/users.html'],['permissions','/module.html?section=permissions'],['unavailability','/module.html?section=unavailability'],['events','/module.html?section=events'],['schedules','/module.html?section=schedules'],['setlists','/setlists.html'],['setlists_history','/setlists.html?view=history'],['songs','/consultar.html'],['new_song','/nova-musica.html']
              ];
              if(setlistId){routes.push(['setlist',`/setlist.html?id=${encodeURIComponent(setlistId)}`],['performance',`/setlist-view.html?id=${encodeURIComponent(setlistId)}`]);}
              for(const vp of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
                await page.setViewportSize({width:vp.width,height:vp.height});
                for(const [label,url] of routes){
                  await page.goto(baseUrl+url,{waitUntil:'networkidle',timeout:45000}).catch(()=>{}); await page.waitForTimeout(1000);
                  for(const theme of ['light','dark']){
                    const findings=await auditPage(page,label,vp,theme); report.items.push({label,url,viewport:vp,theme,...findings});
                  }
                }
              }
              fs.writeFileSync(path.join(out,'audit.json'),JSON.stringify(report,null,2));
              const summary=[];
              for(const i of report.items){ if(i.viewportOverflow||i.touch.length||i.clipped.length||i.contrast.length) summary.push(`${i.label} ${i.viewport.name} ${i.theme}: overflow=${i.viewportOverflow} touch=${i.touch.length} clipped=${i.clipped.length} contrast=${i.contrast.length}`); }
              fs.writeFileSync(path.join(out,'summary.txt'),summary.join('\n')+'\n');
              console.log(summary.join('\n'));
            } finally {
              if(browser) await browser.close().catch(()=>{});
              if(user){ await db.collection('users').doc(user.uid).delete().catch(()=>{}); await auth.deleteUser(user.uid).catch(()=>{}); }
              await admin.app().delete().catch(()=>{});
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node visual-audit.cjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit-production
          path: visual-audit/
          retention-days: 7

name: 🖼️ Visual audit production

# Auditoria extensa de produção; executar apenas quando solicitada.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}
      - name: Install audit dependencies
        run: |
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2 firebase-admin@13.4.0
          npx playwright install chromium
      - name: Capture desktop/mobile and audit UI
        env:
          BASE_URL: https://louvor-ide.web.app
        run: |
          cat > visual-audit.cjs <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const admin = require('firebase-admin');
          const { chromium } = require('playwright');
          const { AxeBuilder } = require('@axe-core/playwright');
          const baseUrl = process.env.BASE_URL;
          const out = path.resolve('visual-audit');
          fs.mkdirSync(out, { recursive: true });
          admin.initializeApp({ credential: admin.credential.applicationDefault(), projectId: 'louvor-ide' });
          const db = admin.firestore();
          const auth = admin.auth();
          const email = `visual.audit.${Date.now()}@louvor-ide.app`;
          const password = `Va!${Date.now()}Aa9`;
          const consentVersion = 'terms:2026-08-25|privacy:2026-08-25';
          let user, browser;
          async function audit(page,label,vp,theme){
            await page.evaluate(t=>{localStorage.setItem('musicIdeTheme',t);document.documentElement.dataset.theme=t;document.documentElement.dataset.themePreference=t;document.documentElement.style.colorScheme=t},theme);
            await page.waitForTimeout(350);
            const safe=`${label}-${vp.name}-${theme}`.replace(/[^a-z0-9-]+/gi,'_');
            await page.screenshot({path:path.join(out,`${safe}.png`),fullPage:true});
            const x=await page.evaluate(()=>{
              const vis=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity!==0&&r.width>0&&r.height>0};
              const touch=[],clipped=[];
              document.querySelectorAll('button,a,input,select,textarea,[role="button"]').forEach(el=>{if(!vis(el))return;const r=el.getBoundingClientRect();if(r.width<44||r.height<44)touch.push({tag:el.tagName,id:el.id||'',text:(el.innerText||el.value||'').trim().slice(0,60),w:Math.round(r.width),h:Math.round(r.height)})});
              document.querySelectorAll('button,a,th,td,label,h1,h2,h3,h4,p,span,small,strong,li').forEach(el=>{if(!vis(el))return;if(el.scrollWidth>el.clientWidth+3&&getComputedStyle(el).overflowX!=='visible')clipped.push({tag:el.tagName,id:el.id||'',text:(el.innerText||'').trim().slice(0,70)})});
              return {viewportOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+3,touch,clipped};
            });
            const axe=await new AxeBuilder({page}).withRules(['color-contrast']).analyze();
            const contrast=axe.violations.flatMap(v=>v.nodes.map(n=>({impact:v.impact,help:v.help,target:n.target})));
            return {...x,contrast};
          }
          (async()=>{const report={generatedAt:new Date().toISOString(),baseUrl,items:[]};try{
            user=await auth.createUser({email,password,displayName:'Visual Audit',emailVerified:true});
            await auth.setCustomUserClaims(user.uid,{superAdmin:true,role:'SUPER_ADMIN'});
            await db.collection('users').doc(user.uid).set({uid:user.uid,email,name:'Visual Audit',displayName:'Visual Audit',role:'SUPER_ADMIN',active:true,lgpdConsentVersion:consentVersion,createdAt:admin.firestore.FieldValue.serverTimestamp(),updatedAt:admin.firestore.FieldValue.serverTimestamp()});
            const setlists=await db.collection('setlists').orderBy('eventDate','desc').limit(1).get().catch(()=>db.collection('setlists').limit(1).get());
            const setlistId=setlists.empty?'':setlists.docs[0].id;
            browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            await page.goto(`${baseUrl}/login.html`,{waitUntil:'domcontentloaded'});
            await page.fill('#login-email',email);await page.fill('#login-password',password);await page.click('.email-button');
            await page.waitForURL(u=>!u.pathname.endsWith('/login.html'),{timeout:20000});
            const routes=[['dashboard','/index.html'],['users','/users.html'],['permissions','/module.html?section=permissions'],['unavailability','/module.html?section=unavailability'],['events','/module.html?section=events'],['schedules','/module.html?section=schedules'],['setlists','/setlists.html?view=upcoming'],['songs','/consultar.html'],['audit','/module.html?section=audit'],['settings','/module.html?section=settings']];
            if(setlistId) routes.push(['setlist',`/setlist.html?id=${encodeURIComponent(setlistId)}`]);
            for(const vp of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
              await page.setViewportSize({width:vp.width,height:vp.height});
              for(const [label,url] of routes){
                await page.goto(baseUrl+url,{waitUntil:'domcontentloaded',timeout:20000}).catch(()=>{});await page.waitForTimeout(700);
                for(const theme of ['light','dark']) report.items.push({label,url,viewport:vp,theme,...await audit(page,label,vp,theme)});
              }
            }
            fs.writeFileSync(path.join(out,'audit.json'),JSON.stringify(report,null,2));
          }finally{if(browser)await browser.close().catch(()=>{});if(user){await db.collection('users').doc(user.uid).delete().catch(()=>{});await auth.deleteUser(user.uid).catch(()=>{})}await admin.app().delete().catch(()=>{})}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node visual-audit.cjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit-production
          path: visual-audit/
          retention-days: 7

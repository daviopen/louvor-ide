name: Auth Sync

on:
  schedule:
    - cron: "20 10 * * *" # 07:20 em Brasília (UTC-3)
  workflow_dispatch:
    inputs:
      emails:
        description: "E-mails específicos, separados por vírgula (vazio = todos)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/auth-sync.yml"

concurrency:
  group: auth-sync-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile Firebase Auth
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Firebase Admin
        run: npm install --no-save --package-lock=false --omit=dev firebase-admin@14.4.0

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: Reconcile identities
        env:
          GOOGLE_CLOUD_PROJECT: louvor-ide
          GCLOUD_PROJECT: louvor-ide
          AUTH_RECONCILE_EMAILS: ${{ github.event_name == 'push' && 'palomaspcoelho@gmail.com,cruzrayane357@gmail.com' || inputs.emails || '' }}
        run: node src/scripts/reconcile-auth-identities.cjs

name: Notifications

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: notification-outbox-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notifications:
    name: Notifications
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install worker dependencies
        run: npm install --no-save --package-lock=false --omit=dev firebase-admin@14.4.0 web-push@3.6.7

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: Process notification outbox
        env:
          GOOGLE_CLOUD_PROJECT: louvor-ide
          GCLOUD_PROJECT: louvor-ide
          IDE_MUSIC_APP_URL: https://louvor-ide.web.app
          NOTIFICATION_BATCH_SIZE: "25"
          NOTIFICATION_MAX_ATTEMPTS: "5"
          NOTIFICATION_STALE_LOCK_MS: "1200000"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_FROM: ${{ secrets.NOTIFICATION_EMAIL_FROM }}
        run: node src/scripts/process-notification-outbox.cjs

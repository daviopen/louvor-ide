name: Notifications

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "20 10 * * *" # 07:20 em Brasília (UTC-3) - reconciliação diária de identidades
    - cron: "0 11 * * *" # 08:00 em Brasília (UTC-3)
  workflow_dispatch:

concurrency:
  group: notification-outbox-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notifications:
    name: Notifications
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install worker dependencies
        run: npm install --no-save --package-lock=false --omit=dev firebase-admin@14.4.0 @google-cloud/firestore@7.11.6 web-push@3.6.7

      - name: Verify worker runtime
        run: node -e "require('firebase-admin/firestore'); require('@google-cloud/firestore'); require('web-push'); console.log('Notification runtime OK')"

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: Reconcile Firebase Auth
        if: github.event_name == 'schedule' && github.event.schedule == '20 10 * * *'
        env:
          GOOGLE_CLOUD_PROJECT: louvor-ide
          GCLOUD_PROJECT: louvor-ide
        run: node src/scripts/reconcile-auth-identities.cjs

      - name: Enqueue birthday notifications
        if: github.event_name == 'schedule' && github.event.schedule == '0 11 * * *'
        env:
          GOOGLE_CLOUD_PROJECT: louvor-ide
          GCLOUD_PROJECT: louvor-ide
        run: node src/scripts/enqueue-birthday-notifications.cjs

      - name: Process notification outbox
        if: always()
        env:
          GOOGLE_CLOUD_PROJECT: louvor-ide
          GCLOUD_PROJECT: louvor-ide
          IDE_MUSIC_APP_URL: https://louvor-ide.web.app
          NOTIFICATION_BATCH_SIZE: "25"
          NOTIFICATION_MAX_ATTEMPTS: "5"
          NOTIFICATION_STALE_LOCK_MS: "1200000"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL_FROM: ${{ secrets.NOTIFICATION_EMAIL_FROM }}
        run: node src/scripts/process-notification-outbox.cjs

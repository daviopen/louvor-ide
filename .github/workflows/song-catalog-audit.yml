name: 🎵 Song Catalog Audit

on:
  push:
    branches:
      - chore/song-catalog-migration-final
    paths:
      - 'src/scripts/audit-song-catalog.cjs'
      - '.github/workflows/song-catalog-audit.yml'

concurrency:
  group: song-catalog-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save firebase-admin@13.4.0

      - name: Authenticate Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: Audit production song catalog
        env:
          GOOGLE_CLOUD_PROJECT: louvor-ide
          GCLOUD_PROJECT: louvor-ide
        run: node src/scripts/audit-song-catalog.cjs

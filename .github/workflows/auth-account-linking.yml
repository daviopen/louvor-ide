name: 🔗 Reconcile Firebase auth identities

# Operação administrativa sobre dados reais. Nunca executar automaticamente após deploy.
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Digite LOUVOR-IDE-PRODUCTION para confirmar a operação'
        required: true
        type: string

concurrency:
  group: reconcile-firebase-auth-identities
  cancel-in-progress: false

jobs:
  reconcile_auth:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🛡️ Confirmar operação em produção
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_production }}" = "LOUVOR-IDE-PRODUCTION" || {
            echo '❌ Operação bloqueada. Digite LOUVOR-IDE-PRODUCTION para continuar.'
            exit 1
          }

      - name: 📂 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔑 Autenticar service account Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: 📦 Instalar Firebase Admin
        run: npm install --no-save firebase-admin@13.4.0

      - name: 🧹 Reconciliar identidades duplicadas já existentes
        run: node src/scripts/reconcile-auth-identities.cjs

      - name: 🔗 Impedir novas contas com o mesmo e-mail
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth application-default print-access-token)"
          CONFIG_URL="https://identitytoolkit.googleapis.com/admin/v2/projects/louvor-ide/config"
          HTTP_CODE="$(curl -sS -o /tmp/auth-config.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "X-Goog-User-Project: louvor-ide" \
            -d '{"signIn":{"allowDuplicateEmails":false}}' \
            "${CONFIG_URL}?updateMask=signIn.allowDuplicateEmails")"
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            cat /tmp/auth-config.json
            exit 1
          fi
          test "$(jq -r '.signIn.allowDuplicateEmails // false' /tmp/auth-config.json)" = "false"

      - name: 🔍 Validar configuração efetiva
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth application-default print-access-token)"
          CONFIG_URL="https://identitytoolkit.googleapis.com/admin/v2/projects/louvor-ide/config"
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "X-Goog-User-Project: louvor-ide" \
            "${CONFIG_URL}" >/tmp/auth-config-verified.json
          test "$(jq -r '.signIn.allowDuplicateEmails // false' /tmp/auth-config-verified.json)" = "false"
          echo "✅ Configuração validada"

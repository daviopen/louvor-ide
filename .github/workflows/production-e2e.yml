name: 🧭 Validate production application (read-only)

# Produção é somente leitura. Este workflow não autentica service account,
# não cria usuários e não grava/apaga documentos no Firestore.
on:
  workflow_dispatch:

concurrency:
  group: production-e2e-read-only
  cancel-in-progress: false

jobs:
  production_read_only:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📂 Checkout versão a validar
        uses: actions/checkout@v4

      - name: 🔒 Confirmar alvo de produção somente leitura
        env:
          E2E_BASE_URL: https://louvor-ide.web.app
        run: |
          set -euo pipefail
          test "${E2E_BASE_URL}" = "https://louvor-ide.web.app"
          echo "✅ Validação de produção sem credenciais administrativas"

      - name: 🌐 Validar páginas e assets públicos
        env:
          E2E_BASE_URL: https://louvor-ide.web.app
        run: |
          set -euo pipefail
          for url in \
            "${E2E_BASE_URL}/" \
            "${E2E_BASE_URL}/login.html" \
            "${E2E_BASE_URL}/consultar.html" \
            "${E2E_BASE_URL}/setlists.html?view=upcoming" \
            "${E2E_BASE_URL}/module.html?section=schedules" \
            "${E2E_BASE_URL}/styles/tokens.css" \
            "${E2E_BASE_URL}/js/modules/auth-service.js"
          do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$url")"
            test "$status" = "200" || { echo "❌ $url retornou HTTP $status"; exit 1; }
            echo "✅ $url"
          done

      - name: 🎼 Validar artefatos publicados sem acessar Firestore
        env:
          E2E_BASE_URL: https://louvor-ide.web.app
        run: |
          set -euo pipefail
          curl --fail-with-body -sS "${E2E_BASE_URL}/module.html?section=schedules" -o /tmp/module.html
          curl --fail-with-body -sS "${E2E_BASE_URL}/js/modules/schedules-page.js" -o /tmp/schedules-page.js
          curl --fail-with-body -sS "${E2E_BASE_URL}/services/schedule-service.js" -o /tmp/schedule-service.js
          curl --fail-with-body -sS "${E2E_BASE_URL}/consultar.html" -o /tmp/consultar.html
          grep -q 'Editar escala' /tmp/schedules-page.js
          grep -q 'scheduleCompleteness' /tmp/schedule-service.js
          grep -q 'Consultar músicas' /tmp/consultar.html
          echo "✅ Artefatos publicados validados"

      - name: 🔐 Validar configuração pública do Firebase
        env:
          E2E_BASE_URL: https://louvor-ide.web.app
        run: |
          set -euo pipefail
          curl --fail-with-body -sS "${E2E_BASE_URL}/__/firebase/init.json" -o /tmp/firebase-init.json
          jq -e '.projectId == "louvor-ide"' /tmp/firebase-init.json >/dev/null
          echo "✅ Hosting aponta para o projeto esperado; nenhum acesso ao Firestore foi realizado"

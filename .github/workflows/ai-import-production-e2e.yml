name: 🤖 AI import production E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["🚀 Deploy to Firebase Hosting"]
    types: [completed]

concurrency:
  group: ai-import-production-e2e
  cancel-in-progress: false

jobs:
  ai_import_e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_commit.message, '[ai-import-e2e]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📂 Checkout versão publicada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔑 Autenticar service account Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: 🌐 Instalar navegador E2E
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 firebase-admin@13.4.0
          npx playwright install --with-deps chromium

      - name: 🤖 Validar duas cifras reais no ambiente publicado
        env:
          E2E_BASE_URL: https://louvor-ide.web.app
          FIREBASE_PROJECT_ID: louvor-ide
          E2E_ARTIFACTS_DIR: test-results/ai-import-production
        run: node tests/production-ai-import.e2e.cjs

      - name: 📦 Publicar evidências do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-import-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ai-import-production
          if-no-files-found: warn
          retention-days: 14

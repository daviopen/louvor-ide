name: Align settings menu with project pattern

on:
  push:
    paths:
      - '.github/workflows/apply-settings-menu-pattern.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply standard menu pattern
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Pattern not found: {label}')
              return text.replace(old, new, 1)

          shell_path = Path('src/js/modules/app-shell.js')
          shell = shell_path.read_text(encoding='utf-8')
          old_nav = """    { id: 'administration', label: 'Administração', items: [
      { id: 'audit', label: 'Auditoria', href: 'module.html?section=audit', icon: 'fa-clipboard-list', permission: 'audit' },
      { id: 'settings', label: 'Configurações', href: 'module.html?section=settings', icon: 'fa-gear', adminOnly: true, children: [
        { id: 'settings-template', label: 'Template de Escala', href: 'module.html?section=settings', icon: 'fa-calendar-check', adminOnly: true },
        { id: 'settings-functions', label: 'Funções Ministeriais', href: 'module.html?section=settings&tab=functions', icon: 'fa-layer-group', adminOnly: true }
      ] }
    ] },
"""
          new_nav = """    { id: 'administration', label: 'Administração', items: [
      { id: 'audit', label: 'Auditoria', href: 'module.html?section=audit', icon: 'fa-clipboard-list', permission: 'audit' }
    ] },
    { id: 'settings', label: 'Configurações', items: [
      { id: 'settings-template', label: 'Template de Escala', href: 'module.html?section=settings', icon: 'fa-calendar-check', adminOnly: true },
      { id: 'settings-functions', label: 'Funções Ministeriais', href: 'module.html?section=settings&tab=functions', icon: 'fa-layer-group', adminOnly: true }
    ] },
"""
          shell = replace_once(shell, old_nav, new_nav, 'settings navigation group')
          shell = replace_once(
              shell,
              "    return navigationGroups.flatMap(group => group.items.flatMap(item => [item, ...(item.children || [])]));",
              "    return navigationGroups.flatMap(group => group.items);",
              'navigationItems flattening'
          )
          branch_code = """  function createNavBranch(item, activeId, profile) {
    const visibleChildren = (item.children || []).filter(child => canViewItem(child, profile));
    if (!visibleChildren.length) return createNavLink(item, activeId);
    const branch = element('div', 'ide-sidebar-branch');
    const parent = createNavLink(item, activeId);
    parent.classList.add('ide-sidebar-link--parent');
    const hasActiveChild = visibleChildren.some(child => child.id === activeId);
    if (hasActiveChild) parent.classList.add('has-active-child');
    parent.setAttribute('aria-expanded', String(hasActiveChild));
    const submenu = element('div', 'ide-sidebar-submenu');
    submenu.setAttribute('aria-label', `${item.label} — submenus`);
    visibleChildren.forEach(child => {
      const link = createNavLink(child, activeId);
      link.classList.add('ide-sidebar-sublink');
      submenu.appendChild(link);
    });
    branch.append(parent, submenu);
    return branch;
  }

"""
          shell = replace_once(shell, branch_code, '', 'custom nested branch renderer')
          shell = replace_once(
              shell,
              "      visible.forEach(item => section.appendChild(createNavBranch(item, activeId, profile)));",
              "      visible.forEach(item => section.appendChild(createNavLink(item, activeId)));",
              'standard group renderer'
          )
          shell = shell.replace('../styles/main-menu.css?v=20260827-settings-submenus', '../styles/main-menu.css?v=20260827-settings-menu-standard')
          shell_path.write_text(shell, encoding='utf-8')

          css_path = Path('src/styles/main-menu.css')
          css = css_path.read_text(encoding='utf-8')
          custom_css = """.ide-sidebar-branch { display:grid; gap:2px; }
.ide-sidebar-link--parent.has-active-child { color:var(--ide-primary); background:rgba(216,255,69,.09); }
.ide-sidebar-submenu { display:grid; gap:2px; margin-left:18px; padding-left:10px; border-left:1px solid var(--ide-border-on-dark); }
.ide-sidebar-sublink { min-height:36px; padding-block:7px; font-size:.9rem; }
.ide-sidebar-sublink i { width:22px; flex-basis:22px; font-size:.82rem; }
"""
          css = replace_once(css, custom_css, '', 'custom submenu css')
          css = css.replace('.ide-sidebar-collapsed .ide-sidebar-submenu { display:none; }\n', '')
          css = css.replace('  .ide-sidebar-collapsed .ide-sidebar-submenu { display:grid; }\n', '')
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('tests/main-menu.test.js')
          tests = test_path.read_text(encoding='utf-8')
          old_test = """test('configurações organiza funcionalidades distintas como submenus reais', () => {
  assert.match(shell, /id: 'settings'.*children:/s);
  assert.match(shell, /id: 'settings-template'.*Template de Escala/s);
  assert.match(shell, /id: 'settings-functions'.*Funções Ministeriais/s);
  assert.match(shell, /createNavBranch/);
  assert.match(css, /ide-sidebar-submenu/);
});
"""
          new_test = """test('configurações segue o mesmo padrão de grupo usado por Escalas e Setlist', () => {
  assert.match(shell, /id: 'settings', label: 'Configurações', items:/);
  assert.match(shell, /id: 'settings-template'.*Template de Escala/s);
  assert.match(shell, /id: 'settings-functions'.*Funções Ministeriais/s);
  assert.doesNotMatch(shell, /createNavBranch|children:/);
  assert.doesNotMatch(css, /ide-sidebar-submenu|ide-sidebar-sublink/);
});
"""
          tests = replace_once(tests, old_test, new_test, 'main menu settings pattern test')
          test_path.write_text(tests, encoding='utf-8')

          ministry_test_path = Path('tests/ministry-functions-ui.test.js')
          mt = ministry_test_path.read_text(encoding='utf-8')
          mt = replace_once(
              mt,
              "  assert.match(shell, /id: 'settings'.*adminOnly: true/);",
              "  assert.match(shell, /id: 'settings', label: 'Configurações', items:/);\n  assert.match(shell, /id: 'settings-template'.*adminOnly: true/);",
              'ministry settings group assertion'
          )
          ministry_test_path.write_text(mt, encoding='utf-8')

          agents_path = Path('AGENTS.md')
          agents = agents_path.read_text(encoding='utf-8')
          old_rule = """- Funcionalidades distintas pertencentes ao mesmo domínio devem ser expostas como **submenus reais** do item pai na navegação principal. Exemplo: `Configurações > Template de Escala` e `Configurações > Funções Ministeriais`.
- Abas/tabs devem ser usadas apenas para diferentes visões, estados ou recortes da **mesma funcionalidade**, e não para esconder módulos funcionais independentes.
- Cada submenu deve possuir destino/estado de rota identificável e indicação correta de item ativo.
- Regras de autorização do item pai e dos filhos devem permanecer explícitas e coerentes; ocultar submenu não substitui guard, Rules ou backend.
- A hierarquia deve funcionar em desktop, drawer mobile e sidebar recolhida, com navegação por teclado e sem duplicar a mesma navegação dentro do conteúdo da página sem necessidade.
- Ao adicionar uma nova funcionalidade sob um domínio já existente, avaliar primeiro se ela deve ser um submenu antes de criar novo item de primeiro nível.
"""
          new_rule = """- Funcionalidades distintas pertencentes ao mesmo domínio devem ser expostas como **subitens do grupo correspondente**, reutilizando o mesmo padrão já adotado pela navegação principal. Exemplo: o título `Configurações` deve funcionar como seção, assim como `Escalas`, `Setlist` e `Músicas`, contendo `Template de Escala` e `Funções Ministeriais` diretamente abaixo.
- Não criar tratamento visual ou componente de navegação exclusivo para um domínio quando a mesma hierarquia puder ser representada por `navigationGroups` e seus `items`.
- Abas/tabs devem ser usadas apenas para diferentes visões, estados ou recortes da **mesma funcionalidade**, e não para esconder módulos funcionais independentes.
- Cada subitem deve possuir destino/estado de rota identificável e indicação correta de item ativo.
- Regras de autorização dos subitens devem permanecer explícitas e coerentes; ocultar item não substitui guard, Rules ou backend.
- A hierarquia deve funcionar em desktop, drawer mobile e sidebar recolhida, com navegação por teclado e sem duplicar a mesma navegação dentro do conteúdo da página sem necessidade.
- Ao adicionar uma nova funcionalidade sob um domínio já existente, primeiro reutilizar o padrão de grupo/seção já existente antes de criar novo item de primeiro nível ou nova variante visual.
"""
          agents = replace_once(agents, old_rule, new_rule, 'AGENTS navigation standard')
          agents_path.write_text(agents, encoding='utf-8')
          PY
      - name: Run tests
        run: npm test
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/apply-settings-menu-pattern.yml
          git add src/js/modules/app-shell.js src/styles/main-menu.css tests/main-menu.test.js tests/ministry-functions-ui.test.js AGENTS.md .github/workflows/apply-settings-menu-pattern.yml
          git commit -m 'fix(nav): align settings with standard sidebar groups'
          git push origin HEAD:main

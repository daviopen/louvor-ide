name: 🧹 Legacy Data Cleanup

on:
  workflow_run:
    workflows: ["🚀 Deploy to Firebase Hosting"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Cleanup mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
          - restore

concurrency:
  group: legacy-data-cleanup-production
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save firebase-admin@13.4.0

      - name: Authenticate Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: Resolve cleanup mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "value=apply" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup legacy data
        env:
          GOOGLE_CLOUD_PROJECT: louvor-ide
          GCLOUD_PROJECT: louvor-ide
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.mode.outputs.value }}" in
            apply) node src/scripts/cleanup-legacy-data.cjs --apply ;;
            restore) node src/scripts/cleanup-legacy-data.cjs --restore-musicas ;;
            dry-run) node src/scripts/cleanup-legacy-data.cjs ;;
            *) echo "Invalid cleanup mode"; exit 2 ;;
          esac

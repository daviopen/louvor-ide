name: 🎭 Full-system Playwright E2E

on:
  workflow_run:
    workflows:
      - "🚀 Deploy to Firebase Hosting"
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

concurrency:
  group: full-system-playwright-e2e
  cancel-in-progress: false

jobs:
  full_system_e2e:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📂 Checkout versão a validar
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔑 Autenticar service account Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: 🌐 Instalar Playwright e dependências E2E
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 firebase-admin@13.4.0
          npx playwright install --with-deps chromium

      - name: 🎭 Executar simulação completa do sistema publicado
        env:
          E2E_BASE_URL: https://louvor-ide.web.app
          FIREBASE_PROJECT_ID: louvor-ide
          E2E_ARTIFACTS_DIR: test-results/full-system
        run: node tests/production-full-system-v2.e2e.cjs

      - name: 📦 Publicar relatório, screenshot e trace do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/full-system
          if-no-files-found: warn
          retention-days: 14

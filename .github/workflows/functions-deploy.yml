name: 🔐 Deploy Firebase auth backend

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/functions-deploy.yml'
  workflow_dispatch:

jobs:
  validate_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: 📦 Instalar backend
        working-directory: functions
        run: npm install --package-lock-only && npm ci

      - name: 🔎 Validar sintaxe da função
        run: node --check functions/index.js

      - name: 🔑 Autenticar service account Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOUVOR_IDE }}

      - name: 🚀 Publicar updateUserIdentity
        run: npx firebase-tools@13.35.1 deploy --only functions:updateUserIdentity --project louvor-ide --non-interactive

      - name: ✅ Confirmar backend publicado
        run: echo '✅ Backend de sincronização de identidade publicado com Firebase Admin SDK.'
